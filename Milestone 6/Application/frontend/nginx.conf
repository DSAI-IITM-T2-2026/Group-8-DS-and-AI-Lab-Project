server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Reverse proxy to the backend service (see docker-compose.yml). Keeps
    # the frontend's default VITE_API_BASE_URL="/api/v1" working unchanged,
    # matching the Vite dev server's own "/api" proxy behavior.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Single-page app: let React Router (if any) and index.html handle
    # unknown paths instead of returning nginx's 404.
    location / {
        try_files $uri /index.html;
    }
}
