<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Prediction Studio map comparison</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 1184px; height: 534px; margin: 0; overflow: hidden; background: #dfe4e8; }
      main { display: grid; grid-template-columns: 592px 592px; }
      figure { width: 592px; height: 534px; position: relative; margin: 0; overflow: hidden; background: #fff; }
      img { width: 1672px; height: 941px; position: absolute; left: -216px; top: -117px; max-width: none; }
    </style>
  </head>
  <body>
    <main aria-label="Approved map followed by implemented map">
      <figure><img src="/reference/prediction-studio-approved.png" alt="Approved map" /></figure>
      <figure><img src="/qa/implementation-final.png" alt="Implemented map" /></figure>
    </main>
  </body>
</html>
