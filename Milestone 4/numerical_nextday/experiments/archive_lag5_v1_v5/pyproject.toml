[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "numerical-nextday-archive-experiment"
version = "0.1.0"
description = "Archive-based V1-V5 experiments for numerical next-day wildfire risk"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "joblib>=1.3",
  "lightgbm>=4.0",
  "matplotlib>=3.8",
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=14",
  "PyYAML>=6",
  "rasterio>=1.3",
  "scikit-learn>=1.3",
  "xarray>=2024.1",
  "netCDF4>=1.6",
]

[project.optional-dependencies]
cloud = ["google-cloud-storage>=2.14"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
wildfire-nextday = "numerical_nextday.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
